<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전우정밀 차량 운행 및 주유 기록부</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .header h2 { margin: 0; font-size: 18px; color: #0f172a; }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .card-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 8px;
    }
    .summary-text {
      font-size: 13px;
      color: #475569;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 14px;
      font-weight: 500;
    }
    button[type="submit"], .btn-primary {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #msg {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }
    .success { background-color: #dcfce7; color: #166534; display: block !important; }
    .error { background-color: #fee2e2; color: #991b1b; display: block !important; }
    .sub-input { margin-top: 6px; }

    /* 통계 및 기록 테이블 스타일 */
    .section-divider {
      border: 0;
      height: 1px;
      background: #cbd5e1;
      margin: 24px 0 16px 0;
    }
    .table-title {
      font-size: 15px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
      background: #fff;
    }
    table.data-table th, table.data-table td {
      border: 1px solid #e2e8f0;
      padding: 7px 4px;
    }
    table.data-table th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: bold;
    }
    .table-scroll {
      overflow-x: auto;
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }
    .fuel-highlight {
      background-color: #fffde7;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 로그인 화면 -->
  <div id="loginView">
    <h2 style="text-align: center; margin-top: 0; margin-bottom: 20px;">🔐 전우정밀 시스템 로그인</h2>
    <div class="form-group">
      <label>사용자 선택</label>
      <select id="loginUser">
        <option value="">선택하세요</option>
        <option value="관리자">관리자</option>
        <option value="김현준">김현준</option>
        <option value="김동현">김동현</option>
        <option value="이학장">이학장</option>
      </select>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력">
    </div>
    <button type="button" class="btn-primary" onclick="handleLogin()">로그인</button>
  </div>

  <!-- 2. 운행일지 메인 화면 -->
  <div id="mainView" style="display: none;">
    <div class="header">
      <h2>차량 운행/주유 기록부 (<span id="userBadge" style="color: #2563eb;"></span>)</h2>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>

    <div class="summary-text" id="routeSummary">
      선택 차량: - | 출발: 회사 ➔ 도착: 왜관(VPHC)
    </div>

    <form id="vehicleForm">
      <!-- 날짜 -->
      <div class="form-group">
        <label>📅 운행 및 주유 날짜</label>
        <input type="date" id="driveDate" required>
      </div>

      <!-- 운전자 -->
      <div class="form-group">
        <label>👤 운전자 성명</label>
        <div id="driverSelectWrap">
          <select id="driverSelect">
            <option value="김동현">김동현</option>
            <option value="김현준">김현준</option>
            <option value="이학장">이학장</option>
          </select>
        </div>
        <input type="text" id="driverCustom" class="sub-input" placeholder="✍️ [목록에 없는 분만] 운전자 직접 입력">
      </div>

      <!-- 차량 선택 -->
      <div class="form-group">
        <label>🚗 차량 선택</label>
        <select id="carKey" onchange="onCarChange()">
          <option value="7.5톤">7.5톤(파비스) 3528</option>
          <option value="2.5톤">2.5톤(마이티) 8569</option>
          <option value="1톤">1톤(포터) 5378</option>
          <option value="통근차">통근차(솔라티) 8740</option>
        </select>
      </div>

      <!-- 출발지 및 목적지 -->
      <div class="grid-2">
        <div class="form-group">
          <label>📍 출발지</label>
          <select id="startSelect" onchange="updateSummary()">
            <option value="회사(전우정밀)">회사</option>
            <option value="통근노선 시작">통근노선 시작</option>
          </select>
          <input type="text" id="startCustom" class="sub-input" placeholder="직접 입력" oninput="updateSummary()">
        </div>
        <div class="form-group">
          <label>🎯 목적지</label>
          <select id="endSelect" onchange="updateSummary()">
            <option value="왜관(VPHC)">왜관(VPHC)</option>
            <option value="AST(2공장)">AST(2공장)</option>
            <option value="동아금속">동아금속</option>
            <option value="통근노선 종점">통근노선 종점</option>
          </select>
          <input type="text" id="endCustom" class="sub-input" placeholder="직접 입력" oninput="updateSummary()">
        </div>
      </div>

      <!-- 운행 내용 -->
      <div class="form-group">
        <label>📝 운행 내용</label>
        <select id="purpose">
          <option value="납품 및 업무협의">납품 및 업무협의</option>
          <option value="통근버스 운행">통근버스 운행</option>
          <option value="거래처 미팅">거래처 미팅</option>
          <option value="현장 방문">현장 방문</option>
          <option value="주유">주유</option>
          <option value="기타">기타</option>
        </select>
      </div>

      <!-- 주행 거리 박스 -->
      <div class="card-box">
        <div class="card-title">🛣️ 주행거리 산출 (km)</div>
        <div class="grid-3">
          <div>
            <label style="font-size: 11px;">시작거리</label>
            <input type="number" id="startKm" value="0" oninput="calcDistance()" required>
          </div>
          <div>
            <label style="font-size: 11px;">종료거리</label>
            <input type="number" id="endKm" value="0" oninput="calcDistance()" required>
          </div>
          <div>
            <label style="font-size: 11px;">주행거리</label>
            <input type="number" id="totalDistance" value="0" readonly style="background: #e2e8f0; font-weight: bold;">
          </div>
        </div>
      </div>

      <!-- 주유 기록 박스 -->
      <div class="card-box">
        <div class="card-title">⛽ 주유 기록 (선택 사항)</div>
        <div class="grid-3">
          <div>
            <label style="font-size: 11px;">연료 종류</label>
            <select id="fuelType">
              <option value="없음">없음</option>
              <option value="경유">경유</option>
              <option value="LPG">LPG</option>
              <option value="요소수">요소수</option>
            </select>
          </div>
          <div>
            <label style="font-size: 11px;">주입량 (L)</label>
            <input type="number" id="fuelAmount" min="0" value="0">
          </div>
          <div>
            <label style="font-size: 11px;">금액 (원)</label>
            <input type="number" id="fuelPrice" min="0" value="0" step="1000">
          </div>
        </div>
      </div>

      <!-- 비고 -->
      <div class="form-group">
        <label>📝 특이사항 (비고)</label>
        <textarea id="memo" rows="2" placeholder="차량 이상 증상, 주유 내역 등 입력"></textarea>
      </div>

      <button type="submit" id="submitBtn">🚀 기록 저장하기</button>
    </form>

    <div id="msg"></div>

    <!-- 하단 통계 및 최근 기록 뷰어 -->
    <hr class="section-divider">

    <!-- 1. 월별 차량 누적 요약 표 -->
    <div class="table-title">
      <span>📊 차량별 월간 누적 요약</span>
      <select id="summaryMonth" style="width: auto; padding: 4px 8px; font-size: 13px;" onchange="renderSummaryTable()">
      </select>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="summaryTable">
        <thead>
          <tr>
            <th>차종</th>
            <th>주행거리</th>
            <th>LPG금액</th>
            <th>경유주입량</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" style="padding: 12px;">데이터를 불러오는 중입니다...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 2. 최근 운행 및 주유 기록 보기 -->
    <div class="table-title" style="margin-top: 20px;">
      <span>📋 최근 운행/주유 기록 (최근 5건)</span>
      <select id="historyFilter" style="width: auto; padding: 4px 8px; font-size: 13px;" onchange="renderHistoryTable()">
        <option value="전체 보기">전체 보기</option>
        <option value="7.5톤">7.5톤</option>
        <option value="2.5톤">2.5톤</option>
        <option value="1톤">1톤</option>
        <option value="통근차">통근차</option>
      </select>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="historyTable">
        <thead>
          <tr>
            <th>날짜</th>
            <th>운전자</th>
            <th>주행</th>
            <th>구간</th>
            <th>내용</th>
            <th>주유/비고</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6" style="padding: 12px;">표시할 기록이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>

  </div>

</div>

<script>
  // 1. 구글 스프레드시트 및 웹앱 연동 정보
  const SHEET_ID = "1ZiLamZZuSsHZtO00fa8-bKPSVYfCiKMhtZOddU7O49o";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0yIctzaAByhpLPR2skU2sNouES6VoxbKbN3GwL6wuDo_P-KrucCGOkQpsdZsc-BA_g/exec";

  // 2. 사원 계정 & 기본 맵핑 데이터
  const USER_PW = { "관리자": "1111", "김현준": "0000", "김동현": "0000", "이학장": "0000" };
  const CAR_FULL_NAME = {
    "7.5톤": "7.5톤(파비스) 3528",
    "2.5톤": "2.5톤(마이티) 8569",
    "1톤": "1톤(포터) 5378",
    "통근차": "통근차(솔라티) 8740"
  };
  const DRIVER_DEFAULT_CAR = { "김동현": "7.5톤", "김현준": "1톤", "이학장": "1톤" };

  let currentUser = "";
  let sheetHistoryData = [];

  // 초기 날짜 설정
  document.getElementById("driveDate").valueAsDate = new Date();

  // 구글 시트 데이터 실시간 동기화
  function fetchSheetData() {
    fetch(`${CSV_URL}&_ts=${new Date().getTime()}`)
      .then(res => res.text())
      .then(csvText => {
        const rows = csvText.trim().split("\n").map(r => r.split(","));
        if (rows.length > 1) {
          const headers = rows[0].map(h => h.trim().replace(/"/g, ''));
          sheetHistoryData = rows.slice(1).map(row => {
            const obj = {};
            row.forEach((val, i) => {
              if (headers[i]) obj[headers[i]] = val ? val.trim().replace(/"/g, '') : "";
            });
            return obj;
          });

          initMonthSelect();
          renderSummaryTable();
          renderHistoryTable();
          onCarChange();
        }
      })
      .catch(err => console.log("시트 동기화 중...", err));
  }

  // 월 선택 드롭다운 생성
  function initMonthSelect() {
    const monthSelect = document.getElementById("summaryMonth");
    const months = new Set();
    
    // 현재 월 기본 추가
    const nowMonth = new Date().toISOString().slice(0, 7);
    months.add(nowMonth);

    sheetHistoryData.forEach(r => {
      if (r["날짜"] && r["날짜"].length >= 7) {
        months.add(r["날짜"].slice(0, 7));
      }
    });

    const sortedMonths = Array.from(months).sort().reverse();
    monthSelect.innerHTML = sortedMonths.map(m => `<option value="${m}">${m}</option>`).join('');
  }

  // 월간 누적 요약 표 렌더링
  function renderSummaryTable() {
    const targetMonth = document.getElementById("summaryMonth").value;
    const tbody = document.querySelector("#summaryTable tbody");

    const filtered = sheetHistoryData.filter(r => r["날짜"] && r["날짜"].startsWith(targetMonth));

    const carKeys = ["7.5톤", "2.5톤", "1톤", "통근차"];
    let html = "";

    carKeys.forEach(key => {
      const carRows = filtered.filter(r => r["차량"] && r["차량"].includes(key));
      
      const totalKm = carRows.reduce((acc, cur) => acc + (Number(cur["주행거리"]) || 0), 0);
      
      const lpgPrice = carRows
        .filter(r => r["연료종류"] === "LPG")
        .reduce((acc, cur) => acc + (Number(cur["결제금액"]) || 0), 0);

      const dieselLiters = carRows
        .filter(r => r["연료종류"] === "경유")
        .reduce((acc, cur) => acc + (Number(cur["주입량"]) || 0), 0);

      html += `<tr>
        <td style="font-weight: 500;">${CAR_FULL_NAME[key].split(' ')[0]}</td>
        <td>${totalKm > 0 ? totalKm.toLocaleString() + ' km' : '0 km'}</td>
        <td>${lpgPrice > 0 ? lpgPrice.toLocaleString() + ' 원' : '-'}</td>
        <td>${dieselLiters > 0 ? dieselLiters.toLocaleString() + ' L' : '-'}</td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  // 최근 기록 5건 렌더링
  function renderHistoryTable() {
    const filter = document.getElementById("historyFilter").value;
    const tbody = document.querySelector("#historyTable tbody");

    let filtered = sheetHistoryData.slice();
    if (filter !== "전체 보기") {
      filtered = filtered.filter(r => r["차량"] && r["차량"].includes(filter));
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding: 12px;">표시할 기록이 없습니다.</td></tr>`;
      return;
    }

    // 최근 5건 역순 정렬
    const recentRows = filtered.slice(-5).reverse();
    let html = "";

    recentRows.forEach(r => {
      const isFuel = r["연료종류"] && r["연료종류"] !== "없음" && r["연료종류"] !== "";
      const rowClass = isFuel ? "fuel-highlight" : "";
      
      let fuelMemo = [];
      if (isFuel) {
        if (r["주입량"]) fuelMemo.push(`${r["연료종류"]} ${r["주입량"]}L`);
        if (r["결제금액"]) fuelMemo.push(`${Number(r["결제금액"]).toLocaleString()}원`);
      }
      if (r["비고"]) fuelMemo.push(r["비고"]);

      html += `<tr class="${rowClass}">
        <td>${r["날짜"] || ""}</td>
        <td>${r["운전자"] || ""}</td>
        <td><b>${Number(r["주행거리"] || 0).toLocaleString()}km</b></td>
        <td>${(r["출발지"]||"").replace("회사(전우정밀)","회사")} ➔ ${(r["목적지"]||"")}</td>
        <td>${r["운행내용"] || ""}</td>
        <td>${fuelMemo.join(' / ') || "-"}</td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  function handleLogin() {
    const user = document.getElementById("loginUser").value;
    const pw = document.getElementById("loginPw").value;

    if (!user) {
      alert("사용자를 선택해주세요.");
      return;
    }
    if (USER_PW[user] !== pw) {
      alert("비밀번호가 일치하지 않습니다.");
      return;
    }

    currentUser = user;
    document.getElementById("userBadge").textContent = user;
    document.getElementById("loginView").style.display = "none";
    document.getElementById("mainView").style.display = "block";

    if (user !== "관리자") {
      document.getElementById("driverSelectWrap").style.display = "none";
      if (DRIVER_DEFAULT_CAR[user]) {
        document.getElementById("carKey").value = DRIVER_DEFAULT_CAR[user];
      }
    } else {
      document.getElementById("driverSelectWrap").style.display = "block";
    }
    updateSummary();
    fetchSheetData();
  }

  function handleLogout() {
    currentUser = "";
    document.getElementById("loginPw").value = "";
    document.getElementById("mainView").style.display = "none";
    document.getElementById("loginView").style.display = "block";
  }

  function calcDistance() {
    const start = Number(document.getElementById("startKm").value) || 0;
    const end = Number(document.getElementById("endKm").value) || 0;
    const total = end - start;
    document.getElementById("totalDistance").value = total >= 0 ? total : 0;
  }

  function updateSummary() {
    const carKey = document.getElementById("carKey").value;
    const carName = CAR_FULL_NAME[carKey];
    
    const startCustom = document.getElementById("startCustom").value.trim();
    const startFinal = startCustom || document.getElementById("startSelect").value;

    const endCustom = document.getElementById("endCustom").value.trim();
    const endFinal = endCustom || document.getElementById("endSelect").value;

    document.getElementById("routeSummary").textContent = 
      `선택 차량: ${carName} | 출발: ${startFinal} ➔ 도착: ${endFinal}`;
  }

  function onCarChange() {
    updateSummary();
    const carKey = document.getElementById("carKey").value;

    const carRows = sheetHistoryData.filter(r => r["차량"] && r["차량"].includes(carKey));
    if (carRows.length > 0) {
      const lastRow = carRows[carRows.length - 1];
      const lastKm = Number(lastRow["종료거리"]) || 0;
      if (lastKm > 0) {
        document.getElementById("startKm").value = lastKm;
        document.getElementById("endKm").value = lastKm;
        calcDistance();
        return;
      }
    }
    document.getElementById("startKm").value = 0;
    document.getElementById("endKm").value = 0;
    calcDistance();
  }

  // 폼 전송
  document.getElementById("vehicleForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const startKm = Number(document.getElementById("startKm").value) || 0;
    const endKm = Number(document.getElementById("endKm").value) || 0;
    const totalDist = endKm - startKm;

    if (endKm < startKm) {
      alert("종료 거리가 시작 거리보다 작을 수 없습니다!");
      return;
    }
    if (totalDist === 0) {
      alert("주행 거리가 0 km입니다! 종료 거리를 수정해 주세요.");
      return;
    }

    const driverCustom = document.getElementById("driverCustom").value.trim();
    let finalDriver = driverCustom;
    if (!finalDriver) {
      finalDriver = (currentUser === "관리자") ? document.getElementById("driverSelect").value : currentUser;
    }

    const startCustom = document.getElementById("startCustom").value.trim();
    const finalStart = startCustom || document.getElementById("startSelect").value;

    const endCustom = document.getElementById("endCustom").value.trim();
    const finalEnd = endCustom || document.getElementById("endSelect").value;

    const fuelTypeVal = document.getElementById("fuelType").value;
    const fuelAmtVal = Number(document.getElementById("fuelAmount").value) || 0;
    const fuelPriceVal = Number(document.getElementById("fuelPrice").value) || 0;

    const now = new Date();
    const kstTime = now.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });

    const payload = {
      "날짜": document.getElementById("driveDate").value,
      "차량": CAR_FULL_NAME[document.getElementById("carKey").value],
      "운전자": finalDriver,
      "출발지": finalStart,
      "목적지": finalEnd,
      "시작거리": startKm,
      "종료거리": endKm,
      "주행거리": totalDist,
      "운행내용": document.getElementById("purpose").value,
      "비고": document.getElementById("memo").value,
      "입력시간": kstTime,
      "연료종류": fuelTypeVal !== "없음" ? fuelTypeVal : "",
      "주입량": fuelAmtVal > 0 ? fuelAmtVal : "",
      "결제금액": fuelPriceVal > 0 ? fuelPriceVal : ""
    };

    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ 데이터 전송 및 저장 중...";
    msg.className = "";
    msg.style.display = "none";

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      msg.textContent = "✅ 구글 스프레드시트에 성공적으로 저장되었습니다!";
      msg.className = "success";
      
      document.getElementById("startKm").value = endKm;
      document.getElementById("endKm").value = endKm;
      document.getElementById("totalDistance").value = 0;
      document.getElementById("fuelAmount").value = 0;
      document.getElementById("fuelPrice").value = 0;
      document.getElementById("fuelType").value = "없음";
      document.getElementById("memo").value = "";
      
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 기록 저장하기";

      // 2초 후 실시간 표 갱신
      setTimeout(fetchSheetData, 2000);
    })
    .catch((err) => {
      msg.textContent = "❌ 전송 실패: " + err.message;
      msg.className = "error";
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 기록 저장하기";
    });
  });
</script>

</body>
</html>
