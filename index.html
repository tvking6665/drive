<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전우정밀 차량 운행 및 주유 기록부</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0e1117;
      color: #fafafa;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 550px;
      background: #0e1117;
      padding: 4px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #262730;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .header h2 { margin: 0; font-size: 19px; font-weight: 700; color: #ffffff; }
    .btn-logout {
      background: #262730;
      color: #ff4b4b;
      border: 1px solid #363945;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #fafafa;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #363945;
      border-radius: 8px;
      font-size: 14px;
      background-color: #262730;
      color: #ffffff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #ff4b4b;
    }
    .sub-input { margin-top: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    
    .card-box {
      background-color: #1a1c24;
      border: 1px solid #262730;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .summary-text {
      font-size: 13px;
      color: #fafafa;
      background: #1a1c24;
      border-left: 4px solid #ff4b4b;
      padding: 9px 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    button[type="submit"], .btn-primary {
      width: 100%;
      background: #ff4b4b;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { background: #555966; cursor: not-allowed; }

    #msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      display: none;
    }
    .success { background-color: #143823; color: #4ade80; display: block !important; }
    .error { background-color: #4a1d1d; color: #f87171; display: block !important; }

    /* 체크박스 & 스트림릿 전용 UI 스타일 */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 14px 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      user-select: none;
    }
    .checkbox-wrap input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #ff4b4b;
      cursor: pointer;
    }

    .streamlit-box {
      background-color: #161a23;
      border: 1px solid #262730;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin: 10px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 테이블 스타일 */
    .table-container {
      overflow-x: auto;
      border: 1px solid #262730;
      border-radius: 6px;
      background: #0e1117;
    }
    table.custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }
    table.custom-table th {
      background-color: #1a1c24;
      color: #a3a8b8;
      font-weight: 600;
      padding: 9px 12px;
      border-bottom: 1px solid #262730;
      border-right: 1px solid #262730;
    }
    table.custom-table td {
      padding: 9px 12px;
      border-bottom: 1px solid #1a1c24;
      border-right: 1px solid #262730;
      color: #ffffff;
    }
    table.custom-table tr:hover { background-color: #161a23; }
    
    .fuel-highlight {
      background-color: #3b3111 !important;
      color: #fef08a !important;
      font-weight: bold;
    }
    .fuel-highlight td {
      color: #fef08a !important;
      border-bottom: 1px solid #524419 !important;
    }

    /* 스트림릿 아코디언 */
    .expander {
      border: 1px solid #262730;
      border-radius: 8px;
      background-color: #161a23;
      margin-top: 14px;
      overflow: hidden;
    }
    .expander-header {
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .expander-header:hover { background-color: #1c212c; }
    .expander-content {
      padding: 14px;
      border-top: 1px solid #262730;
      background-color: #0e1117;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. 로그인 뷰 -->
  <div id="loginView" style="margin-top: 40px;">
    <h2 style="text-align: center; margin-bottom: 24px;">🔐 전우정밀 시스템 로그인</h2>
    <div class="form-group">
      <label>사용자 이름을 선택하세요</label>
      <select id="loginUser">
        <option value="">선택하세요</option>
        <option value="관리자">관리자</option>
        <option value="김현준">김현준</option>
        <option value="김동현">김동현</option>
        <option value="이학장">이학장</option>
      </select>
    </div>
    <div class="form-group">
      <label>비밀번호를 입력하세요</label>
      <input type="password" id="loginPw" placeholder="비밀번호 입력">
    </div>
    <button type="button" class="btn-primary" onclick="handleLogin()">로그인</button>
  </div>

  <!-- 2. 메인 뷰 -->
  <div id="mainView" style="display: none;">
    <div class="header">
      <h2>차량 운행 및 주유 기록부 (<span id="userBadge" style="color: #ff4b4b;"></span>님)</h2>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </div>

    <form id="vehicleForm">
      <div class="form-group">
        <label>📅 운행 및 주유 날짜</label>
        <input type="date" id="driveDate" required>
      </div>

      <div class="form-group">
        <label>👤 운전자 선택</label>
        <div id="driverSelectWrap">
          <select id="driverSelect">
            <option value="김동현">김동현</option>
            <option value="김현준">김현준</option>
            <option value="이학장">이학장</option>
          </select>
        </div>
        <input type="text" id="driverCustom" class="sub-input" placeholder="✍️ [목록에 이름이 없는 분만] 운전자 성명 직접 입력">
      </div>

      <div class="form-group">
        <label>🚗 차량 선택</label>
        <select id="carKey" onchange="onCarChange()">
          <option value="7.5톤">7.5톤</option>
          <option value="2.5톤">2.5톤</option>
          <option value="1톤">1톤</option>
          <option value="통근차">통근차</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>📍 출발지 선택</label>
          <select id="startSelect" onchange="updateSummary()">
            <option value="회사(전우정밀)">회사</option>
            <option value="통근노선 시작">통근노선 시작</option>
          </select>
          <input type="text" id="startCustom" class="sub-input" placeholder="✍️ [기타 장소] 출발지 직접 입력" oninput="updateSummary()">
        </div>
        <div class="form-group">
          <label>🎯 목적지 선택</label>
          <select id="endSelect" onchange="updateSummary()">
            <option value="왜관(VPHC)">왜관(VPHC)</option>
            <option value="AST(2공장)">AST(2공장)</option>
            <option value="동아금속">동아금속</option>
            <option value="통근노선 종점">통근노선 종점</option>
          </select>
          <input type="text" id="endCustom" class="sub-input" placeholder="✍️ [기타 장소] 목적지 직접 입력" oninput="updateSummary()">
        </div>
      </div>

      <div class="form-group">
        <label>📝 운행 내용</label>
        <select id="purpose">
          <option value="납품 및 업무협의">납품 및 업무협의</option>
          <option value="통근버스 운행">통근버스 운행</option>
          <option value="거래처 미팅">거래처 미팅</option>
          <option value="현장 방문">현장 방문</option>
          <option value="주유">주유</option>
          <option value="기타">기타</option>
        </select>
      </div>

      <div class="summary-text" id="routeSummary">
        선택 차량: - | 출발: 회사 ➔ 도착: 왜관(VPHC)
      </div>

      <div class="card-box">
        <div class="card-title">🛣️ 주행거리 산출 (km)</div>
        <div class="grid-3">
          <div>
            <label style="font-size: 11px;">📍 시작거리</label>
            <input type="number" id="startKm" value="0" oninput="calcDistance()" required>
          </div>
          <div>
            <label style="font-size: 11px;">🏁 종료거리</label>
            <input type="number" id="endKm" value="0" oninput="calcDistance()" required>
          </div>
          <div>
            <label style="font-size: 11px;">주행거리</label>
            <input type="number" id="totalDistance" value="0" readonly style="background: #363945; font-weight: bold; color: #58a6ff;">
          </div>
        </div>
      </div>

      <div class="card-box">
        <div class="card-title">⛽ 주유 기록 (선택 입력)</div>
        <div class="grid-3">
          <div>
            <label style="font-size: 11px;">연료 종류</label>
            <select id="fuelType">
              <option value="없음">없음</option>
              <option value="경유">경유</option>
              <option value="LPG">LPG</option>
              <option value="요소수">요소수</option>
            </select>
          </div>
          <div>
            <label style="font-size: 11px;">주입량 (L)</label>
            <input type="number" id="fuelAmount" min="0" value="0">
          </div>
          <div>
            <label style="font-size: 11px;">결제 금액 (원)</label>
            <input type="number" id="fuelPrice" min="0" value="0" step="1000">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>📝 비고(특이사항) 작성하기</label>
        <textarea id="memo" rows="2" placeholder="특이사항 내용을 입력하세요"></textarea>
      </div>

      <button type="submit" id="submitBtn">🚀 기록 저장</button>
    </form>

    <div id="msg"></div>

    <!-- 하단 통계 섹션 (스트림릿 동일 UI) -->
    <label class="checkbox-wrap">
      <input type="checkbox" id="showSummaryChk" checked onchange="toggleSummaryBox(this.checked)">
      <span>📊 차량별 누적 요약 표 보기 (주행거리 / LPG금액 / 경유주입량)</span>
    </label>

    <div id="summarySection">
      <div class="streamlit-box">
        <label style="font-size: 13px; font-weight: 500; margin-bottom: 6px;">📅 조회할 월을 선택하세요</label>
        <select id="summaryMonthSelect" onchange="renderSummaryTable()">
        </select>

        <div class="section-title" id="summaryTitle">📌 2026-09 운행/주유 데이터 요약 결과</div>

        <div class="table-container">
          <table class="custom-table" id="summaryTable">
            <thead>
              <tr>
                <th>차종</th>
                <th>주행거리</th>
                <th>LPG금액</th>
                <th>경유주입량</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="4" style="text-align: center; color: #8b949e;">데이터를 불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 최근 운행 및 주유 기록 보기 (아코디언) -->
    <div class="expander">
      <div class="expander-header" onclick="toggleExpander()">
        <span id="expanderIcon">▼</span>
        <span>📊 최근 운행 및 주유 기록 보기</span>
      </div>
      <div class="expander-content" id="expanderContent">
        <label style="font-size: 13px; font-weight: 500; margin-bottom: 6px;">🔍 조회할 차량을 선택하세요</label>
        <select id="historyFilter" style="margin-bottom: 12px;" onchange="renderHistoryTable()">
          <option value="전체 보기">전체 보기</option>
          <option value="7.5톤">7.5톤</option>
          <option value="2.5톤">2.5톤</option>
          <option value="1톤">1톤</option>
          <option value="통근차">통근차</option>
        </select>

        <div class="table-container">
          <table class="custom-table" id="historyTable">
            <thead>
              <tr>
                <th style="width: 45px; text-align: center;"></th>
                <th>날짜</th>
                <th>운전자</th>
                <th>주행거리</th>
                <th>시작거리</th>
                <th>종료거리</th>
                <th>출발지</th>
                <th>목적지</th>
                <th>운행내용</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="9" style="text-align: center; color: #8b949e;">기록을 로딩 중입니다...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
  // 1. 연동 주소 설정
  const SHEET_ID = "1_4z6RBNn8HQ1_xfznsITZ0yGWu5xpP-BYDmOdi_ftaE";
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyq0yIctzaAByhpLPR2skU2sNouES6VoxbKbN3GwL6wuDo_P-KrucCGOkQpsdZsc-BA_g/exec";

  // 2. 계정 & 맵핑
  const USER_PW = { "관리자": "1111", "김현준": "0000", "김동현": "0000", "이학장": "0000" };
  const CAR_MAP = {
    "7.5톤": "7.5톤(파비스)",
    "2.5톤": "2.5톤(마이티)",
    "1톤": "1톤(포터)",
    "통근차": "통근차(솔라티)"
  };
  const CAR_FULL_NAME = {
    "7.5톤": "7.5톤(파비스) 3528",
    "2.5톤": "2.5톤(마이티) 8569",
    "1톤": "1톤(포터) 5378",
    "통근차": "통근차(솔라티) 8740"
  };
  const DRIVER_DEFAULT_CAR = { "김동현": "7.5톤", "김현준": "1톤", "이학장": "1톤" };

  let currentUser = "";
  let sheetRows = [];

  // 날짜 기본값
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById("driveDate").value = `${yyyy}-${mm}-${dd}`;

  // 날짜 파싱 보정 함수 (Date(2026,8,11) 형태 및 일반 문자열 대응)
  function parseDateString(val) {
    if (!val) return "";
    let s = String(val).trim();
    if (s.startsWith("Date(") && s.endsWith(")")) {
      const parts = s.replace("Date(", "").replace(")", "").split(",");
      if (parts.length >= 3) {
        const y = parts[0].trim();
        const m = String(Number(parts[1].trim()) + 1).padStart(2, '0');
        const d = String(parts[2].trim()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
    }
    return s.slice(0, 10);
  }

  // 숫자 파싱 함수 (콤마 및 서식 제거)
  function parseNumber(val) {
    if (val === null || val === undefined || val === "") return 0;
    const cleaned = String(val).replace(/[^0-9.-]+/g, "");
    const n = Number(cleaned);
    return isNaN(n) ? 0 : n;
  }

  // 구글 시트 데이터 로드
  function loadSheetData() {
    const callbackName = "handleGvizData_" + Math.floor(Math.random() * 1000000);
    window[callbackName] = function(json) {
      delete window[callbackName];
      document.body.removeChild(script);

      const cols = json.table.cols.map(c => c ? (c.label || "").trim() : "");
      sheetRows = json.table.rows.map(r => {
        const rowObj = {};
        r.c.forEach((cell, idx) => {
          const colName = cols[idx];
          if (colName) {
            // cell.f(포맷된 문자열)가 있으면 우선 사용, 없으면 cell.v 사용
            let val = "";
            if (cell) {
              val = (cell.f !== undefined && cell.f !== null) ? cell.f : (cell.v !== null ? cell.v : "");
            }
            rowObj[colName] = val;
          }
        });

        // 날짜 정상 변환
        rowObj["날짜"] = parseDateString(rowObj["날짜"]);

        // 시작/종료 거리 기반으로 주행거리가 비어있거나 0이면 자동 산출
        const startK = parseNumber(rowObj["시작거리"]);
        const endK = parseNumber(rowObj["종료거리"]);
        let dist = parseNumber(rowObj["주행거리"]);
        if (dist === 0 && endK > startK) {
          dist = endK - startK;
        }
        rowObj["_시작거리"] = startK;
        rowObj["_종료거리"] = endK;
        rowObj["_주행거리"] = dist;

        return rowObj;
      });

      initMonths();
      renderSummaryTable();
      renderHistoryTable();
      onCarChange();
    };

    const script = document.createElement("script");
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&_ts=${new Date().getTime()}`;
    document.body.appendChild(script);
  }

  function initMonths() {
    const mSelect = document.getElementById("summaryMonthSelect");
    const mSet = new Set();
    const currentM = `${yyyy}-${mm}`;
    mSet.add(currentM);

    sheetRows.forEach(r => {
      const d = String(r["날짜"] || "");
      if (d.length >= 7) mSet.add(d.slice(0, 7));
    });

    const sorted = Array.from(mSet).sort().reverse();
    mSelect.innerHTML = sorted.map(m => `<option value="${m}">${m}</option>`).join('');
  }

  function renderSummaryTable() {
    const month = document.getElementById("summaryMonthSelect").value || `${yyyy}-${mm}`;
    document.getElementById("summaryTitle").textContent = `📌 ${month} 운행/주유 데이터 요약 결과`;

    const filtered = sheetRows.filter(r => String(r["날짜"] || "").startsWith(month));
    const tbody = document.querySelector("#summaryTable tbody");

    const cars = ["7.5톤", "2.5톤", "1톤", "통근차"];
    let html = "";

    cars.forEach(carKey => {
      const displayName = CAR_MAP[carKey];
      const carData = filtered.filter(r => String(r["차량"] || "").includes(carKey));

      const totalDist = carData.reduce((acc, cur) => acc + cur["_주행거리"], 0);
      
      const lpgPrice = carData
        .filter(r => String(r["연료종류"] || "").trim() === "LPG")
        .reduce((acc, cur) => acc + parseNumber(cur["결제금액"]), 0);

      const dieselLiters = carData
        .filter(r => String(r["연료종류"] || "").trim() === "경유")
        .reduce((acc, cur) => acc + parseNumber(cur["주입량"]), 0);

      html += `<tr>
        <td>${displayName}</td>
        <td>${totalDist > 0 ? totalDist.toLocaleString() + ' km' : '0 km'}</td>
        <td>${lpgPrice > 0 ? lpgPrice.toLocaleString() + ' 원' : '-'}</td>
        <td>${dieselLiters > 0 ? dieselLiters.toLocaleString() + ' L' : '-'}</td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  function renderHistoryTable() {
    const filter = document.getElementById("historyFilter").value;
    const tbody = document.querySelector("#historyTable tbody");

    let filtered = sheetRows.map((r, idx) => ({ ...r, _index: idx + 1 }));
    if (filter !== "전체 보기") {
      filtered = filtered.filter(r => String(r["차량"] || "").includes(filter));
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: #8b949e; padding: 14px;">표시할 기록이 없습니다.</td></tr>`;
      return;
    }

    // 최근 5건 역순 정렬
    const recent = filtered.slice(-5).reverse();
    let html = "";

    recent.forEach(r => {
      const fuelType = String(r["연료종류"] || "").trim();
      const isFuel = fuelType !== "" && fuelType !== "없음";
      const rowClass = isFuel ? "fuel-highlight" : "";

      const dist = r["_주행거리"];
      const start = r["_시작거리"];
      const end = r["_종료거리"];
      const startNode = (String(r["출발지"] || "")).replace("회사(전우정밀)", "회사");

      html += `<tr class="${rowClass}">
        <td style="color: #8b949e; text-align: center;">${r._index}</td>
        <td>${r["날짜"] || ""}</td>
        <td>${r["운전자"] || ""}</td>
        <td>${dist > 0 ? dist.toLocaleString() + ' km' : '0 km'}</td>
        <td>${start > 0 ? start.toLocaleString() + ' km' : '0 km'}</td>
        <td>${end > 0 ? end.toLocaleString() + ' km' : '0 km'}</td>
        <td>${startNode}</td>
        <td>${r["목적지"] || ""}</td>
        <td>${r["운행내용"] || ""}</td>
      </tr>`;
    });

    tbody.innerHTML = html;
  }

  function toggleSummaryBox(show) {
    document.getElementById("summarySection").style.display = show ? "block" : "none";
    if (show) renderSummaryTable();
  }

  function toggleExpander() {
    const content = document.getElementById("expanderContent");
    const icon = document.getElementById("expanderIcon");
    if (content.style.display === "none") {
      content.style.display = "block";
      icon.textContent = "▼";
    } else {
      content.style.display = "none";
      icon.textContent = "▶";
    }
  }

  function handleLogin() {
    const user = document.getElementById("loginUser").value;
    const pw = document.getElementById("loginPw").value;

    if (!user) {
      alert("사용자를 먼저 선택해주세요.");
      return;
    }
    if (USER_PW[user] !== pw) {
      alert("비밀번호가 일치하지 않습니다.");
      return;
    }

    currentUser = user;
    document.getElementById("userBadge").textContent = user;
    document.getElementById("loginView").style.display = "none";
    document.getElementById("mainView").style.display = "block";

    if (user !== "관리자") {
      document.getElementById("driverSelectWrap").style.display = "none";
      if (DRIVER_DEFAULT_CAR[user]) {
        document.getElementById("carKey").value = DRIVER_DEFAULT_CAR[user];
      }
    } else {
      document.getElementById("driverSelectWrap").style.display = "block";
    }

    updateSummary();
    loadSheetData();
  }

  function handleLogout() {
    currentUser = "";
    document.getElementById("loginPw").value = "";
    document.getElementById("mainView").style.display = "none";
    document.getElementById("loginView").style.display = "block";
  }

  function calcDistance() {
    const start = Number(document.getElementById("startKm").value) || 0;
    const end = Number(document.getElementById("endKm").value) || 0;
    const total = end - start;
    document.getElementById("totalDistance").value = total >= 0 ? total : 0;
  }

  function updateSummary() {
    const carKey = document.getElementById("carKey").value;
    const carName = CAR_FULL_NAME[carKey];
    
    const startCustom = document.getElementById("startCustom").value.trim();
    const startFinal = startCustom || document.getElementById("startSelect").value;

    const endCustom = document.getElementById("endCustom").value.trim();
    const endFinal = endCustom || document.getElementById("endSelect").value;

    document.getElementById("routeSummary").textContent = 
      `선택 차량: ${carName} | 출발: ${startFinal} ➔ 도착: ${endFinal}`;
  }

  function onCarChange() {
    updateSummary();
    const carKey = document.getElementById("carKey").value;

    // 해당 차량의 가장 마지막 종료거리를 찾아서 시작거리에 대입
    const carRows = sheetRows.filter(r => String(r["차량"] || "").includes(carKey));
    if (carRows.length > 0) {
      const lastRow = carRows[carRows.length - 1];
      const lastKm = lastRow["_종료거리"] || 0;
      if (lastKm > 0) {
        document.getElementById("startKm").value = lastKm;
        document.getElementById("endKm").value = lastKm;
        calcDistance();
        return;
      }
    }
    document.getElementById("startKm").value = 0;
    document.getElementById("endKm").value = 0;
    calcDistance();
  }

  // 폼 전송
  document.getElementById("vehicleForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const startKm = Number(document.getElementById("startKm").value) || 0;
    const endKm = Number(document.getElementById("endKm").value) || 0;
    const totalDist = endKm - startKm;

    if (endKm < startKm) {
      alert("종료 거리가 시작 거리보다 작을 수 없습니다!");
      return;
    }
    if (totalDist === 0) {
      alert("주행 거리가 0 km입니다! 종료 거리를 수정해 주세요.");
      return;
    }

    const driverCustom = document.getElementById("driverCustom").value.trim();
    let finalDriver = driverCustom;
    if (!finalDriver) {
      finalDriver = (currentUser === "관리자") ? document.getElementById("driverSelect").value : currentUser;
    }

    const startCustom = document.getElementById("startCustom").value.trim();
    const finalStart = startCustom || document.getElementById("startSelect").value;

    const endCustom = document.getElementById("endCustom").value.trim();
    const finalEnd = endCustom || document.getElementById("endSelect").value;

    const fuelTypeVal = document.getElementById("fuelType").value;
    const fuelAmtVal = Number(document.getElementById("fuelAmount").value) || 0;
    const fuelPriceVal = Number(document.getElementById("fuelPrice").value) || 0;

    const now = new Date();
    const kstTime = now.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });

    const payload = {
      "날짜": document.getElementById("driveDate").value,
      "차량": CAR_FULL_NAME[document.getElementById("carKey").value],
      "운전자": finalDriver,
      "출발지": finalStart,
      "목적지": finalEnd,
      "시작거리": startKm,
      "종료거리": endKm,
      "주행거리": totalDist,
      "운행내용": document.getElementById("purpose").value,
      "비고": document.getElementById("memo").value,
      "입력시간": kstTime,
      "연료종류": fuelTypeVal !== "없음" ? fuelTypeVal : "",
      "주입량": fuelAmtVal > 0 ? fuelAmtVal : "",
      "결제금액": fuelPriceVal > 0 ? fuelPriceVal : ""
    };

    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ 데이터 전송 및 저장 중...";
    msg.className = "";
    msg.style.display = "none";

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      msg.textContent = "✅ 구글 스프레드시트에 성공적으로 저장되었습니다!";
      msg.className = "success";
      
      document.getElementById("startKm").value = endKm;
      document.getElementById("endKm").value = endKm;
      document.getElementById("totalDistance").value = 0;
      document.getElementById("fuelAmount").value = 0;
      document.getElementById("fuelPrice").value = 0;
      document.getElementById("fuelType").value = "없음";
      document.getElementById("memo").value = "";
      
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 기록 저장";

      setTimeout(loadSheetData, 2000);
    })
    .catch((err) => {
      msg.textContent = "❌ 전송 실패: " + err.message;
      msg.className = "error";
      submitBtn.disabled = false;
      submitBtn.textContent = "🚀 기록 저장";
    });
  });
</script>

</body>
</html>
